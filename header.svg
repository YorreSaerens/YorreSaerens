<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yorre Saerens - developer, SAERFORGE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#14261a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3d48a">
        <animate attributeName="stop-color" values="#a3d48a;#4ade80;#a3d48a" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#4ade80">
        <animate attributeName="stop-color" values="#4ade80;#a3d48a;#4ade80" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="240" rx="18" fill="url(#bg)"/>

  <!-- zwevende pixelblokjes (knipoog naar je avatar) -->
  <g fill="#a3d48a">
    <rect x="70" y="40" width="22" height="22" opacity="0.25">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="150" y="170" width="34" height="34" opacity="0.15">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="760" y="50" width="30" height="30" opacity="0.2">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,16;0,0" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="830" y="150" width="18" height="18" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="690" y="185" width="40" height="40" opacity="0.1">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- naam -->
  <text x="450" y="105" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="54" font-weight="700" fill="url(#accent)" filter="url(#glow)" opacity="0">
    Yorre Saerens
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0,16" to="0,0" dur="1s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- subtitel -->
  <text x="450" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#c9d1d9" opacity="0">
    Solo developer &#183; Founder @ SAERFORGE
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.9s" fill="freeze"/>
  </text>

  <!-- lijn die zich uitrolt -->
  <rect x="300" y="170" height="3" rx="1.5" fill="url(#accent)" width="0">
    <animate attributeName="width" from="0" to="300" dur="1.2s" begin="1.3s" fill="freeze"/>
  </rect>

  <!-- knipperende cursor -->
  <rect x="610" y="124" width="3" height="28" fill="#a3d48a" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.5;0.51" dur="1.1s" begin="2s" repeatCount="indefinite"/>
  </rect>
</svg>
